---
# Static checks for every pull request and for every merge into main.
#
# This repository is public. So the job runs on a GitHub-hosted runner, never
# on a self-hosted runner: a pull request from a fork must not reach the
# homelab. The job has no secret and no OIDC token. packer validate uses fake
# values and does not connect to Proxmox.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-packer@v3
        with:
          version: "1.13.1"

      - name: Format
        run: packer fmt -check -diff -recursive modules

      # The step prints only the file and the line, never the value.
      - name: No IP addresses, private keys or UUIDs
        run: |
          P=(-e '(^|[^0-9.])([0-9]{1,3}\.){3}[0-9]{1,3}([^0-9.]|$)'
             -e '-----BEGIN [A-Z ]*PRIVATE KEY-----'
             -e '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}')
          # 0.0.0.0 (all interfaces) and 127.0.0.1 (this host) are not secret.
          FOUND=$(git ls-files -z | xargs -0 grep -HnIE "${P[@]}" \
            | sed -E 's/(^|[^0-9.])(0\.0\.0\.0|127\.0\.0\.1)([^0-9.]|$)/\1 \3/g' \
            | grep -E "${P[@]}" | cut -d: -f1,2 || true)
          if [ -n "$FOUND" ]; then
            printf '%s\n' "$FOUND" | while IFS=: read -r F L; do
              echo "::error file=$F,line=$L::Remove this value. This repository is public, so it must not hold an IP address, a private key or a UUID."
            done
            exit 1
          fi
          echo "No IP address, private key or UUID found."

      - name: Lint the workflows and the scripts
        run: |
          command -v shellcheck >/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null; }
          V=1.7.12
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$V/actionlint_${V}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
          git ls-files -z 'modules/*.sh' | xargs -0 -r shellcheck -S warning
          echo "Workflows and scripts: no findings."

      - name: Validate each module
        env:
          # packer init reads the plugin releases from the GitHub API. The token
          # prevents the rate limit for the shared addresses of hosted runners.
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
          # Fake values.
          PKR_VAR_env: "ci"
          PKR_VAR_vm_name: "ci-template"
          PKR_VAR_agent: "1"
          PKR_VAR_proxmox_node: "ci-node"
          PKR_VAR_proxmox_iso_file: "local:iso/ci.iso"
          PKR_VAR_cores: "2"
          PKR_VAR_memory: "2048"
          PKR_VAR_http_bind_address: "ci.invalid"
          PKR_VAR_http_bind_port: "8000"
          PKR_VAR_proxmox_api_url: "https://ci.invalid/api2/json"
          PKR_VAR_proxmox_api_token_id: "ci@pve!ci"
          PKR_VAR_proxmox_api_token_secret: "ci"
        run: |
          umask 077
          ssh-keygen -q -t ed25519 -N '' -C ci -f "$RUNNER_TEMP/ci_key"
          KEY=$(cat "$RUNNER_TEMP/ci_key.pub")
          export PKR_VAR_automation_ca_public_key="$KEY" PKR_VAR_build_ssh_public_key="$KEY" \
            PKR_VAR_build_ssh_private_key_file="$RUNNER_TEMP/ci_key"

          FAIL=0
          shopt -s nullglob
          for D in modules/*/; do
            M=$(basename "$D")
            # The release tag holds only modules/$M/, so check a copy that holds only that folder.
            COPY="$RUNNER_TEMP/release/$M"
            mkdir -p "$COPY"
            git archive HEAD "modules/$M" | tar -x -C "$COPY"
            if (cd "$COPY/modules/$M" && packer init . >/dev/null && packer validate .); then
              echo "modules/$M: OK"
            else
              echo "::error file=modules/$M::packer validate failed on a copy that holds only modules/$M/, the same files as its release tag."
              FAIL=1
            fi
          done
          exit "$FAIL"
